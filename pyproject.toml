[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-equitact"
version = "0.1.0"
description = "Paper-aligned typed equivariant touch and causal reactive diffusion"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
zarr = ["zarr>=2.16,<3"]

[project.scripts]
dex-equitact = "dex_equitact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
